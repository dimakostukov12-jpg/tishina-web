<style>
:root{color-scheme:light;--bg:#E7D8BE;--ink:#2d2114;--muted:#857352;--acc:#966f31;

*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#F2E8D2,#E7D8BE 40%,#CDB48A);

.wrap{max-width:1040px;margin:0 auto;padding:40px 18px 90px}
.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,7vw,54px);margin:12px 0 10px;letter-spacing:.01em}
.lede{color:var(--muted);max-width:62ch;font-size:15px;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
figure{margin:0}
figure img{width:100%;display:block;border:1px solid rgba(120,90,40,.2);border-radius:16px;
  box-shadow:0 26px 60px -36px rgba(70,50,20,.55)}
figcaption{font-size:12.5px;margin-top:9px;color:var(--ink);text-align:center}
figcaption b{color:var(--acc);font-weight:600}
</style>
