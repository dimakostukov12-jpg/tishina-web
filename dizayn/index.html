<style>

<div class="wrap">
  <div class="eyebrow">Иммерсия · тёплая спа-эстетика</div>
  <h1>Цветовые решения</h1>
  <p class="lede">По референсу «золотого часа» (лён, камень, растения, дорогой ретрит) — цветовые решения приложения, каждое с экранами. Мягкий свет, воздух, спокойствие.</p>

  <h2>Светлые</h2>
  <figure><img src="img/warm-1.jpg" alt=""><figcaption><b>1 · Золотой час</b> — крем, песок, мягкое золото (ближе всего к референсу).</figcaption></figure>
  <figure><img src="img/warm-2.jpg" alt=""><figcaption><b>2 · Шалфей и лён</b> — бежевый/овсяный с шалфейно-зелёным акцентом и деревом.</figcaption></figure>
  <figure><img src="img/warm-3.jpg" alt=""><figcaption><b>3 · Глина и песок</b> — тёплая терракота, песок, крем; заземлённо.</figcaption></figure>
  <figure><img src="img/warm-4.jpg" alt=""><figcaption><b>4 · Молоко и мёд</b> — очень светлый молочный с медово-янтарным акцентом.</figcaption></figure>
  <figure><img src="img/warm-5.jpg" alt=""><figcaption><b>5 · Тёплый камень</b> — серо-бежевый камень с бронзой и свечным золотом.</figcaption></figure>

  <h2>С тёмно-коричневым</h2>
  <figure><img src="img/warm-6.jpg" alt=""><figcaption><b>6 · Крем и эспрессо</b> — светлый фон, тёмно-коричневый текст, кнопки и меню.</figcaption></figure>
  <figure><img src="img/warm-7.jpg" alt=""><figcaption><b>7 · Орех и песок</b> — песок с тёмным ореховым деревом в карточках и золотом.</figcaption></figure>
  <figure><img src="img/warm-8.jpg" alt=""><figcaption><b>8 · Овёс и какао</b> — светлый овёс с тёмным какао-акцентом и ноткой шалфея.</figcaption></figure>
  <figure><img src="img/warm-9.jpg" alt=""><figcaption><b>9 · Крем, шоколад, терракота</b> — крем с шоколадно-коричневым и тёплой терракотой.</figcaption></figure>
  <figure><img src="img/warm-10.jpg" alt=""><figcaption><b>10 · Тёмно-коричневый герой</b> — светлая база с крупным шоколадным блоком-героем, контраст.</figcaption></figure>
