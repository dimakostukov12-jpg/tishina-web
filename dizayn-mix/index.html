  <div class="eyebrow">Иммерсия · симбиоз «Золотой час» + «Орех и песок»</div>
  <h1>10 оттенков</h1>
  <p class="lede">Соединил два твоих фаворита — тёплый «золотой час» (крем/песок/золото) и «орех и песок» (тёмный орех в карточках) — и поиграл оттенками. От светлого баланса до более тёмного ореха.</p>
  <figure><img src="img/mix-1.jpg" alt=""><figcaption><b>1</b> — крем + светлый орех, мягкое золото (баланс).</figcaption></figure>
  <figure><img src="img/mix-2.jpg" alt=""><figcaption><b>2</b> — глубже песок, насыщенный орех, медовое золото.</figcaption></figure>
  <figure><img src="img/mix-3.jpg" alt=""><figcaption><b>3</b> — сильное золотое свечение, ореховый герой, янтарь.</figcaption></figure>
  <figure><img src="img/mix-4.jpg" alt=""><figcaption><b>4</b> — светлее айвори, эспрессо-ореховое меню, шампань.</figcaption></figure>
  <figure><img src="img/mix-5.jpg" alt=""><figcaption><b>5</b> — карамель-песок, богатый орех, бронза.</figcaption></figure>
  <figure><img src="img/mix-6.jpg" alt=""><figcaption><b>6</b> — тёплый овёс, какао-орех, бледное золото.</figcaption></figure>
  <figure><img src="img/mix-7.jpg" alt=""><figcaption><b>7</b> — крем, каштаново-коричневые карточки, антик-золото (контрастнее).</figcaption></figure>
  <figure><img src="img/mix-8.jpg" alt=""><figcaption><b>8</b> — медово-кремовый, тёмный орех, приглушённое старое золото.</figcaption></figure>
  <figure><img src="img/mix-9.jpg" alt=""><figcaption><b>9</b> — песок, орех с ноткой терракоты, мягкое золото.</figcaption></figure>
  <figure><img src="img/mix-10.jpg" alt=""><figcaption><b>10</b> — тёплый грейж-крем, ореховые карточки, свечное золото.</figcaption></figure>
